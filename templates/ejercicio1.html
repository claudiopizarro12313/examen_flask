<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Cálculo de compras</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="form-card">
        <h1>Calculo de compras</h1>
        <form action="/ejercicio1" method="POST">
            <div class="form-group">
                <label for="nombre">Ingresa tu nombre</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form-group">
                <label for="edad">Ingresa tu edad</label>
                <input type="number" id="edad" name="edad" min="1" required>
            </div>
            <div class="form-group">
                <label for="cantidad">Ingresa la cantidad de tarros de pintura a comprar</label>
                <input type="number" id="cantidad" name="cantidad" min="1" required>
            </div>
            <button type="submit" class="btn-submit">Calcular</button>
        </form>

        {% if resultado %}
        <div class="resultados">
            <p>Nombre del cliente: {{ nombre }}</p>
            <p>Total sin descuento: ${{ total_sin_descuento }}</p>
            <p>El descuento es : ${{ descuento }}</p>
            <p>El total a pagar es de : ${{ total_pagar }}</p>
        </div>
        {% endif %}

        <a href="/" class="volver">← Volver al menú</a>
    </div>
</body>
</html>
