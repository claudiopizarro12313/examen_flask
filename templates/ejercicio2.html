<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - Inicio de sesion</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="form-card">
        <h1>Inicio de sesion</h1>
        <form action="/ejercicio2" method="POST">
            <div class="form-group">
                <label for="usuario">Ingresa tu nombre</label>
                <input type="text" id="usuario" name="usuario" required>
            </div>
            <div class="form-group">
                <label for="contrasena">Ingresa tu contraseña</label>
                <input type="password" id="contrasena" name="contrasena" required>
            </div>
            <button type="submit" class="btn-submit">Verificar</button>
        </form>

        {% if mensaje %}
        <div class="resultados">
            <p>{{ mensaje }}</p>
        </div>
        {% endif %}

        <a href="/" class="volver">← Volver al menú</a>
    </div>
</body>
</html>
